<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin – ALTCHAT</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <h1>Admin Panel</h1>
  <table>
    <tr><th>User</th><th>Role</th></tr>
    {% for u in users %}
    <tr><td>{{ u['username'] }}</td><td>{{ u['role'] }}</td></tr>
    {% endfor %}
  </table>
  <div id="version">{{ version }}</div>
</body>
</html>
