<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Altchat – Meine Chats</title>
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <link href="https://fonts.googleapis.com/css2?family=TikTok+Sans&display=swap" rel="stylesheet">
  <style>
    :root {
      --on: 0;
    }

    html, body {
      background-color: hsl(calc(200 - (var(--on) * 160)), calc((20 + (var(--on) * 50)) * 1%), calc((20 + (var(--on) * 60)) * 1%));
      color: #0f0;
      font-family: 'TikTok Sans', sans-serif;
      margin: 0;
      padding: 0;
      transition: background-color 0.5s ease;
    }

    header {
      background-color: rgba(0,0,0,0.8);
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 0 15px #00ff00aa;
      position: relative;
    }

    header img {
      height: 79px;
      user-select: none;
    }

    .menu-button {
      background: none;
      border: none;
      font-size: 28px;
      color: #00ff00;
      cursor: pointer;
    }

    .dropdown {
      position: absolute;
      top: 100%;
      right: 20px;
      background-color: rgba(0,0,0,0.95);
      border: 1px solid #00ff00;
      border-radius: 10px;
      display: none;
      flex-direction: column;
      min-width: 160px;
      z-index: 100;
    }

    .dropdown.show {
      display: flex;
    }

    .dropdown button,
    .dropdown label {
      padding: 12px 16px;
      background: none;
      border: none;
      text-align: left;
      color: #00ff00;
      cursor: pointer;
      font-size: 14px;
      font-family: monospace;
    }

    .dropdown button:hover,
    .dropdown label:hover {
      background-color: #003300;
    }

    .switchdnd {
      position: relative;
      display: inline-block;
      width: 20px;
      height: 5px;
    }

    .switchdnd input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #333;
      transition: .4s;
      border-radius: 34px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 22px;
      width: 22px;
      left: 2px;
      bottom: 2px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #00ff00;
    }

    input:checked + .slider:before {
      transform: translateX(24px);
    }

    .light-toggle {
      cursor: pointer;
      width: 40px;
      height: 40px;
      margin-right: 10px;
      transition: transform 0.3s ease;
    }

    .light-toggle:hover {
      transform: scale(1.1);
    }

    .chat-entry {
      background: #111;
      border: 1px solid #0f0;
      padding: 10px;
      margin: 10px 20px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      cursor: pointer;
    }

    .chat-entry:hover {
      background: #222;
    }

    .chat-entry img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      margin-right: 10px;
      border: 2px solid #0f0;
    }

    .chat-title {
      font-size: 18px;
    }

    h1 {
      margin: 20px;
    }
  </style>
</head>
<body>
  <header>
    <div style="display: flex; align-items: center; gap: 10px;">
      <img src="{{ url_for('static', filename='logo.gif') }}" alt="Altchat Logo" />
      <svg class="light-toggle" id="lightToggle" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
    </div>
    <div>
      <button class="menu-button" id="hamburgerBtn">☰</button>
      <div class="dropdown" id="dropdownMenu">
        <label class="toggle-container">
          DND-Modus
          <label class="switchdnd">
            <input type="checkbox" id="dndToggle" {% if status == 'dnd' %} checked {% endif %}>
            <span class="slider"></span>
          </label>
        </label>
        <button onclick="location.href='/profile/{{ username }}'">Mein Profil</button>
        <button onclick="location.href='/friend_requests'">Freunde Hinzufügen</button>
        <button onclick="location.href='/admin'">Admin Panel</button>
        <button onclick="location.href='{{ url_for('logout') }}'">Logout</button>
      </div>
    </div>
  </header>

  <h1>🧠 Meine Chats</h1>

  <div onclick="openChat('main')" class="chat-entry">
    <img src="/static/profile_pics/mainroom.png" alt="Main">
    <div class="chat-title">🌍 Main Room</div>
  </div>

  {% for friend in friends %}
  <div onclick="openChat('{{ friend.username }}')" class="chat-entry">
    <img src="{{ friend.profile_pic }}" alt="Profilbild">
    <div class="chat-title">@{{ friend.username }}</div>
  </div>
  {% endfor %}

  <script>
    function openChat(username) {
      window.location.href = "/chat?user=" + username;
    }

    const root = document.documentElement;
    const lightToggle = document.getElementById('lightToggle');

    function setMode(mode) {
      root.style.setProperty('--on', mode);
      localStorage.setItem('darkmode', mode);
    }

    lightToggle.addEventListener('click', () => {
      const current = parseInt(getComputedStyle(root).getPropertyValue('--on'));
      const next = current === 0 ? 1 : 0;
      setMode(next);
    });

    const saved = localStorage.getItem('darkmode');
    if (saved !== null) {
      setMode(parseInt(saved));
    } else {
      setMode(0);
    }

    const hamburgerBtn = document.getElementById('hamburgerBtn');
    const dropdownMenu = document.getElementById('dropdownMenu');

    hamburgerBtn.addEventListener('click', () => {
      dropdownMenu.classList.toggle('show');
    });

    document.addEventListener('click', function(event) {
      if (!event.target.closest('#hamburgerBtn') &&
          !event.target.closest('#dropdownMenu')) {
        dropdownMenu.classList.remove('show');
      }
    });

    const dndToggle = document.getElementById('dndToggle');
    dndToggle.addEventListener('change', () => {
      const status = dndToggle.checked ? 'dnd' : 'online';
      fetch(`/set_status/${status}`);
    });
  </script>
</body>
</html>
