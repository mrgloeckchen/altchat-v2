<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Altchat Login</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: url("https://i.pinimg.com/originals/d7/b9/0c/d7b90cc80898e8823455a127945719af.jpg") no-repeat;
      background-size: cover;
      background-position: center;
    }

    .wrapper {
      margin-top: 40px;
      width: 420px;
      background-color: transparent;
      border: 2px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(15px);
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
      color: #fff;
      border-radius: 16px;
      padding: 20px 30px;
    }

    .wrapper h1 {
      font-size: 30px;
      text-align: center;
    }

    .wrapper .input-box {
      width: 100%;
      height: 50px;
      position: relative;
      margin: 30px 0;
    }

    .input-box input {
      width: 100%;
      height: 100%;
      background: transparent;
      border: none;
      outline: none;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 40px;
      font-size: 16px;
      color: #fff;
      padding: 20px 45px 20px 20px;
    }

    .input-box input::placeholder {
      color: #fff;
    }

    .input-box i {
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 20px;
    }

    .wrapper .btn {
      width: 100%;
      height: 45px;
      background: #fff;
      border: none;
      outline: none;
      border-radius: 40px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      cursor: pointer;
      font-size: 16px;
      color: #333;
      font-weight: 600;
    }

    .wrapper .register-link {
      text-align: center;
      font-size: 14px;
      margin: 20px 0 15px;
    }

    .wrapper .register-link p a {
      color: #fff;
      text-decoration: none;
      font-weight: 600;
    }

    .wrapper .register-link p a:hover {
      text-decoration: underline;
    }

    .flash {
      background-color: #ff4444;
      color: white;
      padding: 0.5rem;
      margin-top: 10px;
      border-radius: 8px;
      font-weight: 700;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <form method="POST" action="{{ url_for('login') }}">
      <h1>Login |Beta</h1>

      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <div class="flash">{{ messages[0] }}</div>
        {% endif %}
      {% endwith %}

      <div class="input-box">
        <input type="text" name="username" placeholder="Benutzername" required />
        <i class='bx bxs-user'></i>
      </div>
      <div class="input-box">
        <input type="password" name="password" placeholder="Passwort" required />
        <i class='bx bxs-lock-alt'></i>
      </div>

      <button type="submit" class="btn">Login</button>

      <div class="register-link">
        <p>Noch kein Account? <a href="{{ url_for('register') }}">Registrieren</a></p>
      </div>
    </form>
  </div>
</body>
</html>
