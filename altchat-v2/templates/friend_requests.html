<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Freundesanfragen</title>
  <link href="https://fonts.googleapis.com/css2?family=TikTok+Sans&display=swap" rel="stylesheet">
  <style>
    body {
      background: #000;
      color: #0f0;
      font-family: 'TikTok Sans', sans-serif;
      padding: 20px;
    }
    h1, h2 {
      margin-bottom: 15px;
    }
    .request, .user-result {
      border: 1px solid #0f0;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 10px;
    }
    form {
      margin-bottom: 20px;
    }
    input[type="text"] {
      background: #000;
      border: 1px solid #0f0;
      color: #0f0;
      padding: 8px;
      border-radius: 6px;
    }
    button {
      background: #0f0;
      color: #000;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    a {
      color: #0f0;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>👥 Deine Freundesanfragen</h1>

  {% if requests %}
    {% for req in requests %}
      <div class="request">
        <strong>@{{ req }}</strong>
        <form method="POST" action="/accept_friend_request">
          <input type="hidden" name="from_user" value="{{ req }}">
          <button>Annehmen</button>
        </form>
      </div>
    {% endfor %}
  {% else %}
    <p>Keine offenen Anfragen.</p>
  {% endif %}

  <hr>

  <h2>🔍 Benutzer suchen</h2>
  <form method="GET" action="/friend_requests">
    <input type="text" name="search" placeholder="Nutzername eingeben...">
    <button>Suchen</button>
  </form>

  {% if results %}
    {% for user in results %}
      <div class="user-result">
        <form method="POST" action="/send_friend_request" style="display: inline;">
          <input type="hidden" name="to_user" value="{{ user }}">
          <strong>@{{ user }}</strong>
          <button>Freund hinzufügen</button>
        </form>
      </div>
    {% endfor %}
  {% endif %}
</body>
</html>
