<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <title>Chat | Altchat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&family=TikTok+Sans:opsz,wght@12..36,300..900&family=Winky+Rough:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">  <style>
    html, body {
      height: 80%;
      margin: 0;
      font-family: 'TikTok Sans', sans-serif;
      background-color: #000;
      color: #00ff00;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: rgba(0,0,0,0.8);
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 0 15px #00ff00aa;
      position: relative;
    }

    header img {
      height: 79px;
      user-select: none;
    }

    .menu-button {
      background: none;
      border: none;
      font-size: 28px;
      color: #00ff00;
      cursor: pointer;
    }

    .dropdown {
      position: absolute;
      top: 100%;
      right: 20px;
      background-color: rgba(0,0,0,0.95);
      border: 1px solid #00ff00;
      border-radius: 10px;
      display: none;
      flex-direction: column;
      min-width: 160px;
      z-index: 100;
    }

    .dropdown.show {
      display: flex;
    }

    .dropdown button,
    .dropdown label {
      padding: 12px 16px;
      background: none;
      border: none;
      text-align: left;
      color: #00ff00;
      cursor: pointer;
      font-size: 14px;
      font-family: 'Roboto Mono', monospace;
    }

    .dropdown button:hover,
    .dropdown label:hover {
      background-color: #003300;
    }

    .dropdown .toggle-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 26px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .switchdnd {
      position: relative;
      display: inline-block;
      width: 20px;
      height: 5px;
    }

    .switchdnd input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #333;
      transition: .4s;
      border-radius: 34px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 22px;
      width: 22px;
      left: 2px;
      bottom: 2px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #00ff00;
    }

    input:checked + .slider:before {
      transform: translateX(24px);
    }

    #main-content {
      flex: 1;
      display: flex;
      padding: 20px;
      gap: 20px;
    }

    #chatBox {
      flex: 3;
      background-color: rgba(0, 0, 0, 0.75);
      border: 1px solid #00ff00;
      border-radius: 10px;
      padding: 15px;
      overflow-y: auto;
      max-height: calc(800px - 50px);
    }

    #usersList {
      flex: 1;
      background-color: rgba(0,0,0,0.75);
      padding: 15px;
      border-radius: 12px;
      max-height: calc(600px - 100px);
      overflow-y: auto;
    }

    .chat-message {
      margin-bottom: 9px;
      word-wrap: break-word;
    }

    .chat-message .username {
      font-weight: bold;
    }

    .typing {
      font-style: italic;
      color: #66ff66;
      height: 20px;
      margin-top: 5px;
      padding-left: 20px;
    }

    form#messageForm {
      display: flex;
      padding: 10px 20px;
      background: rgba(0,0,0,0.7);
      border-top: 1px solid #00ff00;
      align-items: center;
    }

    form#messageForm input[type="text"] {
      flex: 1;
      background: #000;
      border: 1px solid #00ff00;
      border-radius: 8px;
      padding: 12px;
      color: #00ff00;
      font-family: 'Roboto Mono', monospace;
      font-size: 16px;
    }

    form#messageForm input[type="text"]:focus {
      outline: none;
      border-color: #66ff66;
    }

    form#messageForm button {
      background-color: #00ff00;
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      margin-left: 10px;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      font-size: 16px;
      transition: background-color 0.3s ease;
    }

    form#messageForm button:hover {
      background-color: #66ff66;
    }

    #usersList h3 {
      margin-top: 0;
      margin-bottom: 10px;
      border-bottom: 1px solid #00ff00;
      padding-bottom: 5px;
    }

    #usersList ul {
      list-style: none;
      padding-left: 0;
    }

    #usersList ul li {
      margin-bottom: 6px;
      color: #00ff00;
    }

    .toggle-container {
      display: flex;
      align-items: center;
      margin-left: 15px;
    }
  </style>
  <style>
  :root {
    --on: 0;
  }
  html, body {
    background-color: hsl(calc(200 - (var(--on) * 160)), calc((20 + (var(--on) * 50)) * 1%), calc((20 + (var(--on) * 60)) * 1%));
    transition: background-color 0.5s ease;
  }
  .light-toggle {
    cursor: pointer;
    width: 40px;
    height: 40px;
    margin-right: 10px;
    transition: transform 0.3s ease;
  }
  .light-toggle:hover {
    transform: scale(1.1);
  }
</style>
</head>
<body>
  <header>
<div style="display: flex; align-items: center; gap: 10px;">
  <img src="{{ url_for('static', filename='logo.gif') }}" alt="Altchat Logo" />
  <svg class="light-toggle" id="lightToggle" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="5"></circle>
    <line x1="12" y1="1" x2="12" y2="3"></line>
    <line x1="12" y1="21" x2="12" y2="23"></line>
    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
    <line x1="1" y1="12" x2="3" y2="12"></line>
    <line x1="21" y1="12" x2="23" y2="12"></line>
    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
  </svg>
</div>
    <div>
      <button class="menu-button" id="hamburgerBtn">☰</button>
      <div class="dropdown" id="dropdownMenu">
        <label class="toggle-container">
          DND-Modus
          <label class="switchdnd">
            <input type="checkbox" id="dndToggle" {% if status == 'dnd' %} checked {% endif %}>
            <span class="slider"></span>
          </label>
        </label>
        <button onclick="location.href='/mychats'">Meine Chats</button>
        <button onclick="location.href='/profile/{{ username }}'">Mein Profil</button>
        <button onclick="location.href='/friend_requests'">Freunde Hinzufügen</button>
        <button onclick="location.href='/admin'">Admin Panel</button>
        <button onclick="location.href='{{ url_for('logout') }}'">Logout</button>
      </div>
    </div>
  </header>

  <div id="main-content">
    <main id="chatBox">
      {% if messages %}
        {% for msg in messages %}
          {% set user = msg.username %}
          {% set message = msg.message %}
          {% set color = msg.color or get_user_color(user) or '#30D5C8' %}
          <div class="chat-message">
            <strong class="username" style="color: {{ color | default('#30D5C8') }}">{{ user }}</strong>
            <small>[{{ msg.timestamp }}]</small>: 
            <span class="msg-text" data-alt="{{ message }}">{{ message }}</span>
          </div>
        {% endfor %}
      {% else %}
        <div class="chat-message">Keine Nachrichten bisher.</div>
      {% endif %}
    </main>
    <aside id="usersList">
      <h3>Online Nutzer</h3>
      <ul id="onlineUsers"></ul>
    </aside>
  </div>

  <div class="typing" id="typingIndicator"></div>

  <form id="messageForm">
    <input id="messageInput" type="text" autocomplete="off" autofocus placeholder="Deine Nachricht..." />
    <button id="send-button">Senden</button>
    <div class="toggle-container">
      <label class="switch">
        <input type="checkbox" id="decodeToggle">
        <span class="slider"></span>
      </label>
    </div>
  </form>

  <script>
  setInterval(() => {
    socket.emit("keep_alive");
  }, 30000); // alle 30 Sekunden
</script>


  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.6.1/socket.io.min.js"></script>
  <script>
    const socket = io();
    const username = "{{ username }}";
    const room = "{{ room }}";
    console.log("ROOM:", room);
    const chatBox = document.getElementById('chatBox');
    const typingIndicator = document.getElementById('typingIndicator');
    const messageForm = document.getElementById('messageForm');
    const input = document.getElementById('messageInput');
    const onlineUsersList = document.getElementById('onlineUsers');
    const decodeToggle = document.getElementById('decodeToggle');
    const dndToggle = document.getElementById('dndToggle');

    const reverseMap = {
      'å': 'a', '∫': 'b', 'ç': 'c', '∂': 'd', '€': 'e', 'ƒ': 'f', '©': 'g', 'ª': 'h',
      '⁄': 'i', 'º': 'j', '∆': 'k', '@': 'l', 'µ': 'm', '~': 'n', 'ø': 'o', 'π': 'p',
      '«': 'q', '®': 'r', '‚': 's', '†': 't', '¨': 'u', '√': 'v', '∑': 'w', '≈': 'x',
      '¥': 'y', 'Ω': 'z', 'æ': 'ä', 'œ': 'ö', '•': 'ü', '¡': '1', '“': '2', '¶': '3',
      '¢': '4', '[': '5', ']': '6', '/': '7', '{': '8', '}': '9', '≠': '0', '¿': '?',
      '…': ':', '∞': ';'
    };

    function fromAltLanguage(text) {
      return text.split('').map(c => reverseMap[c] || c).join('');
    }

    function toggleMessageDisplay(decode) {
      document.querySelectorAll('.msg-text').forEach(span => {
        const alt = span.getAttribute('data-alt');
        span.textContent = decode ? fromAltLanguage(alt) : alt;
      });
    }

    decodeToggle.addEventListener('change', () => {
      toggleMessageDisplay(decodeToggle.checked);
    });

    socket.emit('join', { username, room });

    socket.on('message', (data) => {
      const userColor =
        data.username === "MrX" ? "red"
        : data.username === "Aleajoleen07" ? "pink"
        : data.color || "#FF69B4";

      const msgElement = document.createElement('div');
      msgElement.classList.add("chat-message");

      msgElement.innerHTML = `
        <strong class="username" style="color: ${userColor}">${data.username}</strong>
        <small>[${data.timestamp}]</small>: 
        <span class="msg-text" data-alt="${data.message}">
          ${decodeToggle.checked ? fromAltLanguage(data.message) : data.message}
        </span>
      `;
      chatBox.appendChild(msgElement);
      chatBox.scrollTop = chatBox.scrollHeight;
    });

    socket.on('force_logout', () => {
      window.location.href = '/logout';
    });

    socket.on('user_update', users => {
      onlineUsersList.innerHTML = '';
      users.forEach(user => {
        const li = document.createElement('li');
        li.textContent = user;
        if (user === username) li.style.fontWeight = 'bold';
        onlineUsersList.appendChild(li);
      });
    });

    socket.on('typing', data => {
      typingIndicator.textContent = data.username + ' tippt...';
      setTimeout(() => {
        typingIndicator.textContent = '';
      }, 2000);
    });

    messageForm.addEventListener('submit', e => {
      e.preventDefault();
      if (!input.value.trim()) return;
      socket.emit('message', { message: input.value, room });
      input.value = '';
    });

    input.addEventListener('input', () => {
      socket.emit('typing', { username });
    });

    window.addEventListener('beforeunload', () => {
      socket.emit('leave', { username, room });
    });

    const hamburgerBtn = document.getElementById('hamburgerBtn');
    const dropdownMenu = document.getElementById('dropdownMenu');

    hamburgerBtn.addEventListener('click', () => {
      dropdownMenu.classList.toggle('show');
    });

    dndToggle.addEventListener('change', () => {
      const status = dndToggle.checked ? 'dnd' : 'online';
      fetch(`/set_status/${status}`);
    });

    window.addEventListener('click', function(event) {
      if (!event.target.closest('#hamburgerBtn') &&
          !event.target.closest('#dropdownMenu')) {
        dropdownMenu.classList.remove('show');
      }
    });
  </script>
  <script>
  const root = document.documentElement;
  const lightToggle = document.getElementById('lightToggle');

  function setMode(mode) {
    root.style.setProperty('--on', mode);
    localStorage.setItem('darkmode', mode);
  }

  lightToggle.addEventListener('click', () => {
    const current = parseInt(getComputedStyle(root).getPropertyValue('--on'));
    const next = current === 0 ? 1 : 0;
    setMode(next);
  });

  const saved = localStorage.getItem('darkmode');
  if (saved !== null) {
    setMode(parseInt(saved));
  } else {
    setMode(0); // Standard: Darkmode
  }

</script>
</body>
</html>
